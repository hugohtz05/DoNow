{% extends "productivity_tools/base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-6 px-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-2xl">
        
        <h1 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Détail du Bilan Hebdomadaire</h1>
        
        <div class="mb-6 text-gray-700 leading-relaxed">
            <p>{{ reports.content|linebreaks }}</p>
        </div>

        <div class="flex justify-between">
            <a href="{% url 'productivity_tools:delete_weekly_report' reports.pk %}" onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce rapport ?');">
                <button class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                    Supprimer
                </button>
            </a>
            <a href="{% url 'productivity_tools:update_weekly_report' reports.pk %}">
                <button class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                    Modifier
                </button>
            </a>
        </div>
    </div>
</div>
{% endblock %}
