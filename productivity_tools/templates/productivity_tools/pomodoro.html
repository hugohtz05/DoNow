{% extends "productivity_tools/base.html" %}

{% load static%}
{% block content %}
<div class="flex mt-[50px] justify-center  bg-gray-200 ">

    <div class="bg-white shadow-lg rounded-lg w-full sm:w-96 p-8 text-center">

        <h1 class="text-3xl font-semibold text-gray-800 mb-8">Pomodoro</h1>

        <p id="countdown" class="text-5xl font-bold text-gray-900 mb-6">25:00</p>

        <div class="flex justify-between mb-6">
            <button id="work" class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                Travail
            </button>
            <button id="pause" class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                Pause
            </button>
        </div>

        <div class="flex justify-between">
            <button id="start" class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                Commencer
            </button>
            <button id="stop" class="bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800 focus:outline-none transition duration-300">
                Réinitialiser
            </button>
        </div>
    </div>
    <audio id="end-sound" src="{% static '/src/productivity_tools/static/sound/ring.mp3' %}" preload="auto"></audio>
</div>

<script>
    let time = 25 * 60;
let countdownInterval = null;

const countdownEl = document.getElementById('countdown');
const workBtn = document.getElementById('work');
const pauseBtn = document.getElementById('pause');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const endSound = document.getElementById('end-sound');

function updateCountdownDisplay() {
    const minutes = Math.floor(time / 60);
    let seconds = time % 60;
    seconds = seconds < 10 ? '0' + seconds : seconds;
    countdownEl.textContent = `${minutes}:${seconds}`;
}

function startTimer() {
    if (countdownInterval) return;

    countdownInterval = setInterval(() => {
        time--;
        updateCountdownDisplay();

        if (time < 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            countdownEl.textContent = 'Terminé';
            endSound.play();
        }
    }, 1000);
}

function resetTimer(duration) {
    clearInterval(countdownInterval);
    countdownInterval = null;
    time = duration;
    updateCountdownDisplay();
}

workBtn.addEventListener('click', () => resetTimer(25 * 60));
pauseBtn.addEventListener('click', () => resetTimer(5 * 60));
startBtn.addEventListener('click', startTimer);
stopBtn.addEventListener('click', () => resetTimer(25 * 60));

updateCountdownDisplay();

</script>
{% endblock %}
